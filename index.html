    class DepthChartApp {
      constructor() {
        this.depthChart = {};
        this.roster = DEFAULT_ROSTER;
        this.activeTab = 'offense';
        this.depthLevel = 0;
        this.selectedSlot = null;
        this.showPlayerModal = false;
        this.showImportModal = false;
        this.showResetModal = false;
        this.importText = '';
        this.importMessage = '';
        this.searchQuery = '';
        this.saving = false;
        this.loading = true;
        this.darkMode = false;
        this.showOnboarding = false;
        this.draggedPlayer = null;
        this.dragOverPosition = null;
        
        // Undo/Redo stacks
        this.undoStack = [];
        this.redoStack = [];
        this.maxUndoSteps = 20;
        
        // Auto-save indicator
        this.lastSaved = null;

        // Share menu state
        this.showShareMenu = false;
        this.linkCopied = false;
        this.sharedChart = false;
        this.viewingPlayer = null; // Player details modal

        this.init();
      }

      init() {
        // Show loading state
        this.render();

        // Simulate loading for smooth transition
        setTimeout(() => {
          this.loadDarkMode();
          this.loadDepthChart();
          this.loadRoster();
          this.loadFromUrlHash(); // Load shared chart if present
          this.checkOnboarding();
          this.loading = false;
          this.render();
          this.setupKeyboardShortcuts();
        }, 500);
      }

      // Encode depth chart to shareable string (compact format)
      encodeChart() {
        const compact = {};
        for (const [pos, players] of Object.entries(this.depthChart)) {
          const nums = players.map(p => p ? p.number : 0);
          if (nums.some(n => n !== 0)) {
            compact[pos] = nums.filter((n, i) => nums.slice(0, i + 1).some(x => x !== 0));
          }
        }
        const parts = Object.entries(compact).map(([pos, nums]) => pos + ':' + nums.join(','));
        return btoa(parts.join(';'));
      }

      // Decode shareable string to depth chart
      decodeChart(encoded) {
        try {
          const decoded = atob(encoded);
          if (decoded.includes(':') && decoded.includes(';')) {
            const chart = {};
            const parts = decoded.split(';');
            for (const part of parts) {
              const [pos, numsStr] = part.split(':');
              const nums = numsStr.split(',').map(n => parseInt(n) || 0);
              chart[pos] = nums.map(num => {
                if (num === 0) return null;
                return this.roster.find(p => p.number === num) || null;
              });
            }
            return chart;
          }
          const data = JSON.parse(decoded);
          if (data.chart) {
            return data.chart;
          }
        } catch (e) {
          console.error('Failed to decode chart:', e);
        }
        return null;
      }


      // Load chart from URL hash if present
      loadFromUrlHash() {
        const hash = window.location.hash.slice(1);
        if (hash && hash.startsWith('chart=')) {
          const encoded = hash.replace('chart=', '');
          const chart = this.decodeChart(encoded);
          if (chart) {
            this.depthChart = chart;
            this.sharedChart = true; // Flag to show "viewing shared chart" message
          }
        }
      }

      // Generate shareable URL
      getShareableUrl() {
        const encoded = this.encodeChart();
        return `https://psudepthchart.com/#chart=${encoded}`;
      }

      loadDarkMode() {
        const saved = localStorage.getItem('psu-dark-mode');
        if (saved !== null) {
          this.darkMode = JSON.parse(saved);
        } else {
          // Check system preference
          this.darkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        this.applyDarkMode();
      }

      applyDarkMode() {
        if (this.darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }

      toggleDarkMode() {
        this.darkMode = !this.darkMode;
        localStorage.setItem('psu-dark-mode', JSON.stringify(this.darkMode));
        this.applyDarkMode();
        this.render();
      }

      loadDepthChart() {
        const saved = localStorage.getItem('psu-depth-chart');
        if (saved) {
          this.depthChart = JSON.parse(saved);
        } else {
          this.initializeEmptyChart();
        }
      }

      loadRoster() {
        const saved = localStorage.getItem('psu-roster');
        if (saved) {
          this.roster = JSON.parse(saved);
        }
      }

      checkOnboarding() {
        const hasSeenOnboarding = localStorage.getItem('psu-onboarding-seen');
        const hasAnyPlayers = Object.values(this.depthChart).some(arr => arr.some(p => p !== null));
        this.showOnboarding = !hasSeenOnboarding && !hasAnyPlayers;
      }

      dismissOnboarding() {
        this.showOnboarding = false;
        localStorage.setItem('psu-onboarding-seen', 'true');
        this.render();
      }

      initializeEmptyChart() {
        Object.values(POSITIONS).flat().forEach(pos => {
          const key = pos.isRight ? `${pos.code}-R` : pos.code;
          this.depthChart[key] = Array(pos.depth).fill(null);
        });
      }

      // Save state for undo
      saveStateForUndo() {
        this.undoStack.push(JSON.stringify(this.depthChart));
        if (this.undoStack.length > this.maxUndoSteps) {
          this.undoStack.shift();
        }
        this.redoStack = []; // Clear redo stack on new action
      }

      undo() {
        if (this.undoStack.length > 0) {
          this.redoStack.push(JSON.stringify(this.depthChart));
          this.depthChart = JSON.parse(this.undoStack.pop());
          this.autoSave();
          this.render();
        }
      }

      redo() {
        if (this.redoStack.length > 0) {
          this.undoStack.push(JSON.stringify(this.depthChart));
          this.depthChart = JSON.parse(this.redoStack.pop());
          this.autoSave();
          this.render();
        }
      }

      autoSave() {
        localStorage.setItem('psu-depth-chart', JSON.stringify(this.depthChart));
        this.lastSaved = new Date();
        this.saving = true;
        this.render();
        setTimeout(() => {
          this.saving = false;
          this.render();
        }, 1500);
      }

      exportDepthChart() {
        let text = 'PENN STATE FOOTBALL DEPTH CHART\n================================\n';
        text += `Generated: ${new Date().toLocaleDateString()}\n\n`;
        
        const sections = {
          'OFFENSE': ['QB', 'RB', 'WR-X', 'WR-Z', 'WR-SLOT', 'TE', 'OT', 'OT-R', 'OG', 'OG-R', 'C'],
          'DEFENSE': ['DE-1', 'DE-2', 'DT-1', 'DT-2', 'LB-ILB', 'LB-OLB', 'CB-X', 'CB-Y', 'CB-SLOT', 'S-FS', 'S-SS'],
          'SPECIAL TEAMS': ['K', 'P', 'LS']
        };
        
        for (const [section, positions] of Object.entries(sections)) {
          text += `${section}\n${'-'.repeat(section.length)}\n\n`;
          
          for (const pos of positions) {
            const players = this.depthChart[pos] || [];
            const filled = players.filter(p => p !== null);
            
            if (filled.length > 0) {
              const posLabel = pos.replace('-R', ' (Right)').replace('-', ' ');
              text += `${posLabel}:\n`;
              filled.forEach((p, i) => {
                text += `  ${i + 1}. #${p.number} ${p.name} (${p.year})\n`;
              });
              text += '\n';
            }
          }
          text += '\n';
        }

        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `penn-state-depth-chart-${new Date().toISOString().split('T')[0]}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

      importRoster() {
        try {
          const lines = this.importText.split('\n').filter(line => line.trim());
          const newRoster = [];
          
          for (const line of lines) {
            const commaFormat = line.match(/(\d+),?\s*([^,]+),?\s*([A-Z]{1,3}),?\s*(.+)/);
            const hashFormat = line.match(/#(\d+)\s+([A-Za-z\s'.]+?)\s+([A-Z]{1,3})\s+(.+)/);
            
            let match = commaFormat || hashFormat;
            
            if (match) {
              const number = parseInt(match[1]);
              const name = match[2].trim();
              const position = match[3].trim();
              const year = match[4].trim();
              
              const validPositions = ['QB', 'RB', 'WR', 'TE', 'OL', 'DE', 'DT', 'LB', 'CB', 'S', 'K', 'P', 'LS'];
              if (validPositions.includes(position) && !isNaN(number)) {
                newRoster.push({ name, number, position, year });
              }
            }
          }
          
          if (newRoster.length > 0) {
            this.roster = newRoster;
            localStorage.setItem('psu-roster', JSON.stringify(newRoster));
            this.importMessage = `✓ Successfully imported ${newRoster.length} players!`;
            setTimeout(() => {
              this.showImportModal = false;
              this.importText = '';
              this.importMessage = '';
              this.render();
            }, 2000);
          } else {
            this.importMessage = '✗ No valid players found. Please check the format.';
          }
          this.render();
        } catch (error) {
          this.importMessage = '✗ Error parsing roster data. Please check the format.';
          this.render();
        }
      }

      getAvailablePlayers(posCode) {
        let positionToSearch = posCode.replace('-R', '');
        if (positionToSearch.startsWith('WR-')) positionToSearch = 'WR';
        else if (['OT', 'OG', 'C'].includes(positionToSearch)) positionToSearch = 'OL';
        else if (positionToSearch.startsWith('CB-')) positionToSearch = 'CB';
        else if (positionToSearch.startsWith('S-')) positionToSearch = 'S';
        else if (positionToSearch.startsWith('LB-')) positionToSearch = 'LB';
        else if (positionToSearch.startsWith('DE-')) positionToSearch = 'DE';
        else if (positionToSearch.startsWith('DT-')) positionToSearch = 'DT';

        // Allow CB, S, and DB players to be placed at any defensive back position (CB or Safety)
        let positionsToInclude = [positionToSearch];
        if (positionToSearch === 'CB' || positionToSearch === 'S') {
          positionsToInclude = ['CB', 'S', 'DB'];
        }

        const allPlayers = this.roster.filter(p => positionsToInclude.includes(p.position));

        // Get all players assigned to ANY position in the entire depth chart
        const allAssigned = [];
        Object.values(this.depthChart).forEach(depthArray => {
          depthArray.forEach(player => {
            if (player) allAssigned.push(player);
          });
        });

        // Filter out players already assigned anywhere
        let available = allPlayers.filter(p =>
          !allAssigned.some(a => a.number === p.number && a.name === p.name)
        );

        // Apply search filter
        if (this.searchQuery.trim()) {
          const query = this.searchQuery.toLowerCase();
          available = available.filter(p =>
            p.name.toLowerCase().includes(query) ||
            p.number.toString().includes(query)
          );
        }

        return available;
      }

      addPlayer(position, depth, player) {
        this.saveStateForUndo();
        if (!this.depthChart[position]) {
          this.depthChart[position] = [];
        }
        this.depthChart[position] = [...this.depthChart[position]];
        this.depthChart[position][depth] = player;
        this.showPlayerModal = false;
        this.selectedSlot = null;
        this.searchQuery = '';
        this.autoSave();
        this.render();
      }

      removePlayer(pos, depth) {
        this.saveStateForUndo();
        this.depthChart[pos] = [...this.depthChart[pos]];
        this.depthChart[pos][depth] = null;
        this.autoSave();
        this.render();
      }

      // Drag and drop handlers
      handleDragStart(player, position, depth) {
        this.draggedPlayer = { player, fromPosition: position, fromDepth: depth };
      }

      handleDragOver(position, depth, event) {
        event.preventDefault();
        this.dragOverPosition = { position, depth };
        this.render();
      }

      handleDragLeave() {
        this.dragOverPosition = null;
        this.render();
      }

      handleDrop(toPosition, toDepth) {
        if (!this.draggedPlayer) return;
        
        const { player, fromPosition, fromDepth } = this.draggedPlayer;
        
        // Check if the player can play this position
        const fromPosBase = fromPosition.replace('-R', '').split('-')[0];
        const toPosBase = toPosition.replace('-R', '').split('-')[0];
        
        // Simple position compatibility check
        const positionGroups = {
          'WR': ['WR'],
          'OL': ['OT', 'OG', 'C'],
          'CB': ['CB'],
          'S': ['S'],
          'LB': ['LB'],
          'DE': ['DE'],
          'DT': ['DT'],
          'QB': ['QB'],
          'RB': ['RB'],
          'TE': ['TE'],
          'K': ['K'],
          'P': ['P'],
          'LS': ['LS']
        };
        
        let canDrop = false;
        for (const [group, positions] of Object.entries(positionGroups)) {
          if (positions.some(p => fromPosBase.includes(p) || fromPosition.includes(p)) &&
              positions.some(p => toPosBase.includes(p) || toPosition.includes(p))) {
            canDrop = true;
            break;
          }
        }
        
        if (canDrop) {
          this.saveStateForUndo();
          
          // Swap players
          const targetPlayer = this.depthChart[toPosition]?.[toDepth];
          
          this.depthChart[fromPosition] = [...(this.depthChart[fromPosition] || [])];
          this.depthChart[toPosition] = [...(this.depthChart[toPosition] || [])];
          
          this.depthChart[toPosition][toDepth] = player;
          this.depthChart[fromPosition][fromDepth] = targetPlayer || null;
          
          this.autoSave();
        }
        
        this.draggedPlayer = null;
        this.dragOverPosition = null;
        this.render();
      }

      setupKeyboardShortcuts() {
        document.addEventListener('keydown', (e) => {
          // Escape to close modals
          if (e.key === 'Escape') {
            if (this.showPlayerModal) {
              this.showPlayerModal = false;
              this.selectedSlot = null;
              this.searchQuery = '';
              this.render();
            } else if (this.showImportModal) {
              this.showImportModal = false;
              this.importText = '';
              this.importMessage = '';
              this.render();
            } else if (this.showResetModal) {
              this.showResetModal = false;
              this.render();
            }
          }
          
          // Ctrl/Cmd + Z for undo
          if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
            e.preventDefault();
            this.undo();
          }
          
          // Ctrl/Cmd + Shift + Z or Ctrl/Cmd + Y for redo
          if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) {
            e.preventDefault();
            this.redo();
          }
          
          // D for dark mode toggle (when no modal is open)
          if (e.key === 'd' && !this.showPlayerModal && !this.showImportModal && !this.showResetModal && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
            this.toggleDarkMode();
          }
          
          // Arrow keys for depth level (when no modal is open)
          if (!this.showPlayerModal && !this.showImportModal && !this.showResetModal && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
            if (e.key === 'ArrowUp' && this.depthLevel > 0) {
              this.depthLevel--;
              this.render();
            } else if (e.key === 'ArrowDown' && this.depthLevel < 2) {
              this.depthLevel++;
              this.render();
            } else if (e.key === 'ArrowLeft') {
              const tabs = ['offense', 'defense', 'special'];
              const currentIndex = tabs.indexOf(this.activeTab);
              if (currentIndex > 0) {
                this.activeTab = tabs[currentIndex - 1];
                this.render();
              }
            } else if (e.key === 'ArrowRight') {
              const tabs = ['offense', 'defense', 'special'];
              const currentIndex = tabs.indexOf(this.activeTab);
              if (currentIndex < tabs.length - 1) {
                this.activeTab = tabs[currentIndex + 1];
                this.render();
              }
            }
          }
        });
      }

      renderTabs() {
        const tabs = [
          { key: 'offense', label: 'OFFENSE', icon: '🏈' },
          { key: 'defense', label: 'DEFENSE', icon: '🛡️' },
          { key: 'special', label: 'SPECIAL TEAMS', icon: '⭐' }
        ];
        
        return `
          <div class="flex gap-2 mb-4">
            ${tabs.map(tab => `
              <button 
                onclick="app.activeTab = '${tab.key}'; app.render()"
                class="px-6 py-3 rounded-t-lg font-display font-semibold text-lg tracking-wide transition-all border-2 ${
                  this.activeTab === tab.key
                    ? 'bg-white dark:bg-gray-800 text-psu-blue dark:text-white border-psu-blue dark:border-psu-light shadow-lg -mb-[2px] relative z-10'
                    : 'bg-psu-light/50 dark:bg-gray-700 text-white border-transparent hover:bg-psu-light dark:hover:bg-gray-600'
                }"
              >
                <span class="mr-2">${tab.icon}</span>
                ${tab.label}
              </button>
            `).join('')}
          </div>
        `;
      }

      renderDepthSelector() {
        return `
          <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-4 mb-4 border-2 border-psu-blue dark:border-psu-light">
            <div class="flex items-center gap-4 flex-wrap">
              <span class="font-display font-semibold text-psu-blue dark:text-white">DEPTH LEVEL:</span>
              <div class="flex gap-2">
                ${[0, 1, 2].map(level => `
                  <button
                    onclick="app.depthLevel = ${level}; app.render()"
                    class="px-4 py-2 rounded-lg font-semibold transition-all border-2 ${
                      this.depthLevel === level
                        ? 'bg-psu-blue dark:bg-psu-light text-white border-psu-blue dark:border-psu-light shadow-md scale-105'
                        : 'bg-white dark:bg-gray-700 text-psu-blue dark:text-white border-psu-blue dark:border-psu-light hover:bg-gray-50 dark:hover:bg-gray-600'
                    }"
                  >
                    ${level === 0 ? '🥇 Starters' : level === 1 ? '🥈 2nd String' : '🥉 3rd String'}
                  </button>
                `).join('')}
              </div>
              <div class="ml-auto text-sm text-gray-500 dark:text-gray-400">
                Use ↑↓ arrow keys
              </div>
            </div>
          </div>
        `;
      }

      renderField() {
        const positions = POSITIONS[this.activeTab];
        
        return `
          <!-- Desktop/Landscape Field View -->
          <div class="field-view field-container bg-gradient-to-b from-field-green to-field-light rounded-lg shadow-lg p-4 md:p-8 relative overflow-hidden" style="min-height: 600px;">
            <!-- Field markings -->
            <div class="field-lines absolute inset-0 pointer-events-none"></div>
            
            <!-- Yard line numbers -->
            <div class="absolute left-2 top-1/2 -translate-y-1/2 text-white/20 font-display text-4xl font-bold">50</div>
            <div class="absolute right-2 top-1/2 -translate-y-1/2 text-white/20 font-display text-4xl font-bold">50</div>
            
            ${positions.map((pos, index) => this.renderPosition(pos, index)).join('')}
            
            <div class="absolute bottom-4 left-1/2 transform -translate-x-1/2 text-white/20 font-display text-4xl font-bold tracking-widest">
              ${this.activeTab === 'offense' ? 'OFFENSE' : this.activeTab === 'defense' ? 'DEFENSE' : 'SPECIAL TEAMS'}
            </div>
            
            <!-- Print header -->
            <div class="print-only absolute top-2 left-2 text-sm text-gray-600">
              Penn State Football Depth Chart - ${new Date().toLocaleDateString()}
            </div>
          </div>
          
          <!-- Mobile Portrait List View -->
          <div class="mobile-list-view bg-white dark:bg-gray-800 rounded-lg shadow-lg overflow-hidden">
            <div class="bg-field-green p-3 text-center">
              <span class="text-white font-display text-xl font-bold tracking-widest">
                ${this.activeTab === 'offense' ? 'OFFENSE' : this.activeTab === 'defense' ? 'DEFENSE' : 'SPECIAL TEAMS'}
              </span>
            </div>
            <div class="divide-y divide-gray-200 dark:divide-gray-700">
              ${positions.map((pos, index) => this.renderMobilePosition(pos, index)).join('')}
            </div>
          </div>
        `;
      }

      renderPosition(pos, index) {
        const posKey = pos.isRight ? `${pos.code}-R` : pos.code;
        const player = this.depthChart[posKey]?.[this.depthLevel];
        const isDragOver = this.dragOverPosition?.position === posKey && this.dragOverPosition?.depth === this.depthLevel;
        
        return `
          <div 
            class="absolute transform -translate-x-1/2 -translate-y-1/2 position-card"
            style="left: ${pos.x}%; top: ${pos.y}%;"
            data-position="${posKey}"
            data-depth="${this.depthLevel}"
          >
            <div 
              class="tooltip ${player ? 'bg-psu-blue dark:bg-psu-light hover:bg-psu-light dark:hover:bg-blue-700' : 'bg-white dark:bg-gray-700 hover:bg-blue-50 dark:hover:bg-gray-600 border-2 border-psu-blue dark:border-psu-light'} 
                     ${player ? 'text-white' : 'text-psu-blue dark:text-white'} 
                     ${isDragOver ? 'drag-over' : ''}
                     rounded-lg shadow-lg transition-colors cursor-pointer position-card-inner"
              style="min-width: 80px;"
              data-tooltip="${pos.fullName}"
              onclick="app.selectedSlot = { position: '${posKey}', depth: ${this.depthLevel} }; app.showPlayerModal = true; app.render()"
              draggable="${player ? 'true' : 'false'}"
              ondragstart="app.handleDragStart(${player ? JSON.stringify(player).replace(/"/g, '&quot;') : 'null'}, '${posKey}', ${this.depthLevel})"
              ondragover="app.handleDragOver('${posKey}', ${this.depthLevel}, event)"
              ondragleave="app.handleDragLeave()"
              ondrop="app.handleDrop('${posKey}', ${this.depthLevel})"
            >
              <div class="px-2 py-1 ${player ? 'border-b border-white/30' : 'border-b-2 border-psu-blue dark:border-psu-light'} text-center">
                <div class="text-xs font-display font-bold tracking-wide">${pos.name}</div>
              </div>
              ${player ? `
                <div class="px-2 py-2 text-center">
                  <div class="w-8 h-8 mx-auto mb-1 rounded-full bg-white/20 flex items-center justify-center text-xs font-bold">
                    ${this.getPlayerInitials(player.name)}
                  </div>
                  <div class="font-display font-bold text-sm">#${player.number}</div>
                  <div class="text-xs truncate max-w-[70px]" title="${player.name}${player.height ? ' • ' + player.height : ''}${player.weight ? ' • ' + player.weight : ''}">${this.getPlayerLastName(player.name)}</div>
                  <button onclick="event.stopPropagation(); app.viewPlayerDetails(${JSON.stringify(player).replace(/"/g, '&quot;')})" class="inline-block mt-1 text-white/70 hover:text-white" title="View player info">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <circle cx="12" cy="12" r="10"/>
                      <line x1="12" y1="16" x2="12" y2="12"/>
                      <line x1="12" y1="8" x2="12.01" y2="8"/>
                    </svg>
                  </button>
                </div>
              ` : `
                <div class="px-2 py-3 text-center">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="mx-auto opacity-50">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                  </svg>
                </div>
              `}
            </div>
          </div>
        `;
      }

      renderMobilePosition(pos, index) {
        const posKey = pos.isRight ? `${pos.code}-R` : pos.code;
        const player = this.depthChart[posKey]?.[this.depthLevel];
        
        return `
          <div 
            class="flex items-center p-3 cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700 active:bg-gray-100 dark:active:bg-gray-600 transition-colors"
            onclick="app.selectedSlot = { position: '${posKey}', depth: ${this.depthLevel} }; app.showPlayerModal = true; app.render()"
          >
            <div class="w-16 flex-shrink-0">
              <div class="bg-psu-blue dark:bg-psu-light text-white text-center py-1 px-2 rounded font-display font-bold text-sm">
                ${pos.name}
              </div>
            </div>
            <div class="flex-1 ml-3">
              <div class="text-xs text-gray-500 dark:text-gray-400 mb-0.5">${pos.fullName}</div>
              ${player ? `
                <div class="flex items-center gap-2">
                  <div class="w-8 h-8 bg-psu-blue dark:bg-psu-light text-white rounded-full flex items-center justify-center text-xs font-bold">
                    ${this.getPlayerInitials(player.name)}
                  </div>
                  <div class="flex-1">
                    <div class="font-semibold text-gray-900 dark:text-white text-sm">#${player.number} ${player.name}</div>
                    <div class="text-xs text-gray-500 dark:text-gray-400">${player.year}${player.height ? ` • ${player.height}` : ''}${player.weight ? ` • ${player.weight}` : ''}</div>
                  </div>
                  ${player.url ? `<a href="${player.url}" target="_blank" onclick="event.stopPropagation()" class="p-1 text-gray-400 hover:text-psu-blue dark:hover:text-psu-light">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
                      <polyline points="15 3 21 3 21 9"/>
                      <line x1="10" y1="14" x2="21" y2="3"/>
                    </svg>
                  </a>` : ''}
                </div>
              ` : `
                <div class="flex items-center gap-2 text-gray-400 dark:text-gray-500">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                  </svg>
                  <span class="text-sm">Tap to assign player</span>
                </div>
              `}
            </div>
            <div class="flex-shrink-0 text-gray-400 dark:text-gray-500">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"/>
              </svg>
            </div>
          </div>
        `;
      }

      renderKeyboardHints() {
        return `
          <div class="mt-4 text-center text-white/60 text-sm no-print">
            <span class="inline-flex items-center gap-4">
              <span><kbd class="px-2 py-1 bg-white/10 rounded text-xs">←→</kbd> Switch tabs</span>
              <span><kbd class="px-2 py-1 bg-white/10 rounded text-xs">↑↓</kbd> Depth level</span>
              <span><kbd class="px-2 py-1 bg-white/10 rounded text-xs">Ctrl+Z</kbd> Undo</span>
              <span><kbd class="px-2 py-1 bg-white/10 rounded text-xs">D</kbd> Dark mode</span>
              <span><kbd class="px-2 py-1 bg-white/10 rounded text-xs">Esc</kbd> Close modal</span>
            </span>
          </div>
        `;
      }

      renderPlayerModal() {
        if (!this.selectedSlot) return '';
        
        const { position, depth } = this.selectedSlot;
        const availablePlayers = this.getAvailablePlayers(position);
        const currentPlayer = this.depthChart[position]?.[depth];
        
        // Find position info for full name
        const allPositions = [...POSITIONS.offense, ...POSITIONS.defense, ...POSITIONS.special];
        const posInfo = allPositions.find(p => {
          const key = p.isRight ? `${p.code}-R` : p.code;
          return key === position;
        });
        
        return `
          <div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4" onclick="if(event.target === this) { app.showPlayerModal = false; app.selectedSlot = null; app.searchQuery = ''; app.render(); }">

              <div class="p-4 border-b dark:border-gray-700 flex items-center justify-between bg-psu-blue dark:bg-psu-light text-white">
                <div>
                  <h2 class="font-display text-xl font-bold">
                    ${posInfo?.fullName || position}
                  </h2>
                  <p class="text-sm text-white/70">
                    ${depth === 0 ? 'Starter' : `${depth + 1}${depth === 1 ? 'nd' : depth === 2 ? 'rd' : 'th'} String`}
                  </p>
                </div>
                <button onclick="app.showPlayerModal = false; app.selectedSlot = null; app.searchQuery = ''; app.render()" class="text-white/80 hover:text-white p-1">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                  </svg>
                </button>
              </div>
              
              <div class="p-4 border-b dark:border-gray-700">
                <div class="relative">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                  </svg>
                  <input
                    type="text"
                    id="playerSearch"
                    placeholder="Search by name or number..."
                    class="w-full pl-10 pr-4 py-2 border-2 border-gray-200 dark:border-gray-600 rounded-lg focus:border-psu-blue dark:focus:border-psu-light focus:outline-none bg-white dark:bg-gray-700 text-gray-900 dark:text-white"
                    value="${this.searchQuery}"
                  />
                </div>
              </div>
              
              <div class="p-4 overflow-y-auto flex-1">
                ${currentPlayer ? `
                  <div class="mb-4 p-4 bg-psu-blue/10 dark:bg-psu-light/20 rounded-lg border border-psu-blue/30 dark:border-psu-light/30">
                    <div class="text-xs font-semibold text-psu-blue dark:text-psu-light mb-2 uppercase tracking-wide">Current Player</div>
                    <div class="flex items-center gap-3">
                      <div class="w-12 h-12 bg-psu-blue dark:bg-psu-light text-white rounded-full flex items-center justify-center font-bold text-lg">
                        ${this.getPlayerInitials(currentPlayer.name)}
                      </div>
                      <div class="flex-1">
                        <div class="font-bold text-gray-900 dark:text-white">
                          #${currentPlayer.number}
                          ${currentPlayer.url ? `<a href="${currentPlayer.url}" target="_blank" class="hover:underline hover:text-psu-light">${currentPlayer.name}</a>` : currentPlayer.name}
                        </div>
                        <div class="text-sm text-gray-600 dark:text-gray-400">${currentPlayer.year}${currentPlayer.height ? ` • ${currentPlayer.height}` : ''}${currentPlayer.weight ? ` • ${currentPlayer.weight}` : ''}</div>
                        ${currentPlayer.hometown ? `<div class="text-xs text-gray-500 dark:text-gray-500">${currentPlayer.hometown}</div>` : ''}
                      </div>
                      <button onclick="app.removePlayer('${position}', ${depth})" class="p-2 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg transition-colors" title="Remove player">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                          <polyline points="3 6 5 6 21 6"/>
                          <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                        </svg>
                      </button>
                    </div>
                  </div>
                ` : ''}

                ${availablePlayers.length === 0 ? `
                  <div class="text-center py-8">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="mx-auto text-gray-300 dark:text-gray-600 mb-3">

                    <p class="text-gray-500 dark:text-gray-400">
                      ${this.searchQuery ? 'No players match your search' : 'No available players for this position'}

                  </div>
                ` : `
                  <div class="space-y-2">
                    ${availablePlayers.map((player, i) => `
                      <button
                        onclick="app.addPlayer('${position}', ${depth}, ${JSON.stringify(player).replace(/"/g, '&quot;')})"
                        class="w-full text-left bg-gray-50 dark:bg-gray-700 hover:bg-psu-blue/10 dark:hover:bg-psu-light/20 border border-gray-200 dark:border-gray-600 hover:border-psu-blue dark:hover:border-psu-light rounded-lg p-3 transition-colors"
                        >
                        <div class="flex items-center gap-3">
                          <div class="w-10 h-10 bg-gray-200 dark:bg-gray-600 rounded-full flex items-center justify-center text-gray-600 dark:text-gray-300 text-sm font-semibold">
                            ${this.getPlayerInitials(player.name)}
                          </div>
                          <div class="flex-1">
                            <div class="font-semibold text-gray-900 dark:text-white">#${player.number} ${player.name}</div>

                          </div>
                          ${player.url ? `<a href="${player.url}" target="_blank" onclick="event.stopPropagation()" class="p-1 text-gray-400 hover:text-psu-blue dark:hover:text-psu-light" title="View player page">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                              <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
                              <polyline points="15 3 21 3 21 9"/>
                              <line x1="10" y1="14" x2="21" y2="3"/>

        return `
          <div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4" onclick="if(event.target === this) { app.showImportModal = false; app.importText = ''; app.importMessage = ''; app.render(); }">
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl max-w-2xl w-full max-h-[80vh] overflow-hidden flex flex-col">
              <div class="p-4 border-b dark:border-gray-700 flex items-center justify-between bg-psu-blue dark:bg-psu-light text-white">
                <h2 class="font-display text-xl font-bold">Import Roster</h2>
                <button onclick="app.showImportModal = false; app.importText = ''; app.importMessage = ''; app.render()" class="text-white/80 hover:text-white">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                  </svg>
                </button>
              </div>
              
              <div class="p-4 overflow-y-auto flex-1">
                <div class="mb-4">
                  <p class="text-sm text-gray-700 dark:text-gray-300 mb-2">Paste roster data below. Each line should contain:</p>
                  <div class="bg-gray-100 dark:bg-gray-700 p-3 rounded-lg text-sm font-mono text-gray-800 dark:text-gray-200 mb-2">#19 Jack Lambert QB RJr</div>
                  <p class="text-xs text-gray-500 dark:text-gray-400">Format: #Number Name Position Year (or use commas: 19, Jack Lambert, QB, RJr)</p>
                </div>

                <textarea
                  id="importTextarea"
                  placeholder="Paste roster data here..."
                  class="w-full h-64 p-3 border-2 border-gray-200 dark:border-gray-600 rounded-lg font-mono text-sm focus:border-psu-blue dark:focus:border-psu-light focus:outline-none bg-white dark:bg-gray-700 text-gray-900 dark:text-white"
                >${this.importText}</textarea>

                ${this.importMessage ? `
                  <div class="mt-3 p-3 rounded-lg ${
                    this.importMessage.startsWith('✓') ? 'bg-green-50 dark:bg-green-900/30 text-green-800 dark:text-green-300' : 'bg-red-50 dark:bg-red-900/30 text-red-800 dark:text-red-300'
                  }">
                    ${this.importMessage}
                  </div>
                ` : ''}
              </div>

              <div class="p-4 border-t dark:border-gray-700 bg-gray-50 dark:bg-gray-900 flex gap-3">
                <button
                  onclick="app.importRoster()"
                  class="flex-1 bg-psu-blue dark:bg-psu-light hover:bg-psu-light dark:hover:bg-blue-700 text-white px-4 py-3 rounded-lg font-display font-semibold transition-colors"
                >
                  Import Roster
                </button>
                <button
                  onclick="app.showImportModal = false; app.importText = ''; app.importMessage = ''; app.render()"
                  class="px-4 py-3 bg-white dark:bg-gray-800 border-2 border-psu-blue dark:border-psu-light text-psu-blue dark:text-white rounded-lg font-semibold hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors"
                >
                  Cancel
                </button>
              </div>
            </div>
          </div>
        `;
      }

      renderResetModal() {
        return `
          <div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4" onclick="if(event.target === this) { app.showResetModal = false; app.render(); }">
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl max-w-md w-full overflow-hidden">
              <div class="p-6 text-center">
                <div class="w-16 h-16 bg-red-100 dark:bg-red-900/30 rounded-full flex items-center justify-center mx-auto mb-4">
                  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-red-500">
                    <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
                    <line x1="12" y1="9" x2="12" y2="13"/>
                    <line x1="12" y1="17" x2="12.01" y2="17"/>
                  </svg>
                </div>
                <h2 class="font-display text-2xl font-bold text-gray-900 dark:text-white mb-2">Reset Depth Chart?</h2>
                <p class="text-gray-600 dark:text-gray-400 mb-6">
                  This will remove all player assignments. You can undo this action with <kbd class="px-2 py-1 bg-gray-100 dark:bg-gray-700 rounded text-xs">Ctrl+Z</kbd>.
                </p>
                <div class="flex gap-3">
                  <button
                    onclick="app.showResetModal = false; app.render()"
                    class="flex-1 px-4 py-3 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-lg font-semibold hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors"
                  >
                    Cancel
                  </button>
                  <button
                    onclick="app.confirmReset()"
                    class="flex-1 px-4 py-3 bg-red-500 hover:bg-red-600 text-white rounded-lg font-semibold transition-colors"
                  >
                    Reset Chart
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      renderPlayerDetails() {
        const p = this.viewingPlayer;
        if (!p) return '';

        return `
          <div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4" onclick="if(event.target === this) { app.closePlayerDetails(); }">
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl max-w-lg w-full overflow-hidden animate-fadeIn">
              <!-- Header -->
              <div class="bg-gradient-to-r from-psu-blue to-psu-light p-6 text-white">
                <div class="flex items-start justify-between">
                  <div class="flex items-center gap-4">
                    <div class="w-20 h-20 bg-white/20 rounded-full flex items-center justify-center text-3xl font-display font-bold">
                      ${p.number || '--'}
                    </div>
                    <div>
                      <h2 class="font-display text-2xl font-bold">${p.name}</h2>
                      <p class="text-white/80">${p.position} • ${p.year}</p>
                    </div>
                  </div>
                  <button onclick="app.closePlayerDetails()" class="text-white/70 hover:text-white p-1">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <line x1="18" y1="6" x2="6" y2="18"/>
                      <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                  </button>
                </div>
              </div>

              <!-- Stats -->
              <div class="p-6">
                <div class="grid grid-cols-2 gap-4 mb-6">
                  ${p.height ? `
                  <div class="bg-gray-50 dark:bg-gray-700 rounded-lg p-3">
                    <div class="text-xs text-gray-500 dark:text-gray-400 uppercase tracking-wide">Height</div>
                    <div class="text-lg font-semibold text-gray-900 dark:text-white">${p.height}</div>
                  </div>
                  ` : ''}
                  ${p.weight ? `
                  <div class="bg-gray-50 dark:bg-gray-700 rounded-lg p-3">
                    <div class="text-xs text-gray-500 dark:text-gray-400 uppercase tracking-wide">Weight</div>
                    <div class="text-lg font-semibold text-gray-900 dark:text-white">${p.weight}</div>
                  </div>
                  ` : ''}
                </div>

                ${p.hometown || p.highSchool || p.previousSchool ? `
                <div class="space-y-3 mb-6">
                  ${p.hometown ? `
                  <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-psu-blue/10 dark:bg-psu-light/20 rounded-full flex items-center justify-center">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-psu-blue dark:text-psu-light">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
                        <circle cx="12" cy="10" r="3"/>
                      </svg>
                    </div>
                    <div>
                      <div class="text-xs text-gray-500 dark:text-gray-400">Hometown</div>
                      <div class="text-gray-900 dark:text-white font-medium">${p.hometown}</div>
                    </div>
                  </div>
                  ` : ''}
                  ${p.highSchool ? `
                  <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-psu-blue/10 dark:bg-psu-light/20 rounded-full flex items-center justify-center">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-psu-blue dark:text-psu-light">
                        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                        <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                      </svg>
                    </div>
                    <div>
                      <div class="text-xs text-gray-500 dark:text-gray-400">High School</div>
                      <div class="text-gray-900 dark:text-white font-medium">${p.highSchool}</div>
                    </div>
                  </div>
                  ` : ''}
                  ${p.previousSchool ? `
                  <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-psu-blue/10 dark:bg-psu-light/20 rounded-full flex items-center justify-center">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-psu-blue dark:text-psu-light">
                        <circle cx="12" cy="12" r="10"/>
                        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
                      </svg>
                    </div>
                    <div>
                      <div class="text-xs text-gray-500 dark:text-gray-400">Previous School</div>
                      <div class="text-gray-900 dark:text-white font-medium">${p.previousSchool}</div>
                    </div>
                  </div>
                  ` : ''}
                </div>
                ` : ''}

                ${p.url ? `
                <a href="${p.url}" target="_blank" class="flex items-center justify-center gap-2 w-full bg-psu-blue hover:bg-psu-light text-white py-3 rounded-lg font-semibold transition-colors">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
                    <polyline points="15 3 21 3 21 9"/>
                    <line x1="10" y1="14" x2="21" y2="3"/>
                  </svg>
                  View on GoPSUsports.com
                </a>
                ` : ''}
              </div>
            </div>
          </div>
        `;
      }

      attachEventListeners() {
        const textarea = document.getElementById('importTextarea');
        if (textarea) {
          textarea.addEventListener('input', (e) => {
            this.importText = e.target.value;
          });
        }
        
        const searchInput = document.getElementById('playerSearch');
        if (searchInput) {
          searchInput.addEventListener('input', (e) => {
            this.searchQuery = e.target.value;
            this.render();
            // Re-focus the search input after render
            setTimeout(() => {
              const newInput = document.getElementById('playerSearch');
              if (newInput) {
                newInput.focus();
                newInput.setSelectionRange(newInput.value.length, newInput.value.length);
              }
            }, 0);
          });
          searchInput.focus();
        }
      }
    }

    const app = new DepthChartApp();
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(registration => {
            console.log('ServiceWorker registered:', registration.scope);
          })
          .catch(error => {
            console.log('ServiceWorker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
